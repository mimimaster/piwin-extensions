name: validate submission

# pull_request_target runs with the base branch's workflow and scripts, so a
# submission cannot edit the rules that judge it. The PR head is never checked
# out: scripts/validate-pr.mjs reads the changed files through the API as data
# and executes nothing from them.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write # sticky result comment
  issues: write # PR comments are issue comments

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check entries, ownership, history, forks and pinned sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/validate-pr.mjs --github
